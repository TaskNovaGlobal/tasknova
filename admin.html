
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskNova Admin Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 30px;
}

h1 { color: #a78bfa; }

button {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}

.card {
    background: #171f35;
    border: 1px solid #303b57;
    border-radius: 12px;
    padding: 22px 15px;
    min-height: 125px;
}

.icon {
    font-size: 28px;
    margin-bottom: 12px;
}

.card h3 {
    margin: 0;
    font-size: 16px;
}

#message {
    color: #fbbf24;
    margin: 20px 0;
}
</style>
</head>

<body>

<header>
    <h1>TaskNova Admin</h1>
    <button id="logoutButton">Logout</button>
</header>

<p id="message">Checking administrator access...</p>

<main id="dashboard" style="display:none;">
    <h2>Welcome, Administrator</h2>
    <p>Manage your TaskNova platform from here.</p>

    <div class="grid">

        <div class="card">
            <div class="icon">📊</div>
            <h3>Overview</h3>
        </div>

        <div class="card">
            <div class="icon">👥</div>
            <h3>Members</h3>
        </div>

        <div class="card">
            <div class="icon">📋</div>
            <h3>Manage Tasks</h3>
        </div>

        <div class="card">
            <div class="icon">📝</div>
            <h3>Submissions</h3>
        </div>

        <div class="card">
            <div class="icon">💰</div>
            <h3>Wallets</h3>
        </div>

        <div class="card">
            <div class="icon">💳</div>
            <h3>Withdrawals</h3>
        </div>

        <div class="card">
            <div class="icon">🤝</div>
            <h3>Referrals</h3>
        </div>

        <div class="card">
            <div class="icon">⚙️</div>
            <h3>Settings</h3>
        </div>

    </div>
</main>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
    'https://nplaagzwpthofvounzma.supabase.co',
    'sb_publishable_L0govATO3SUeAMmbGGMjNw_F-S0jApB'
);

const message = document.getElementById('message');
const dashboard = document.getElementById('dashboard');

async function checkAdmin() {
    const { data: { user }, error } = await supabase.auth.getUser();

    if (error || !user) {
        window.location.href = 'login.html';
        return;
    }

    const { data: isAdmin, error: adminError } =
        await supabase.rpc('is_tasknova_admin');

    if (adminError || isAdmin !== true) {
        message.textContent =
            'Access denied. This account is not an administrator.';
        return;
    }

    message.textContent = 'Administrator access verified.';
    dashboard.style.display = 'block';
}

document.getElementById('logoutButton').addEventListener(
    'click',
    async () => {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    }
);

checkAdmin();
</script>

</body>
  </html>
