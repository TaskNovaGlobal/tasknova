<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskNova Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{background:#151d35;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;color:#a78bfa;margin:0}
button{border:0;border-radius:8px;padding:11px 15px;background:#7c3aed;color:white;cursor:pointer;font-weight:bold}
button:hover{opacity:.85}
.logout{background:#dc3545}
main{max-width:1000px;margin:25px auto;padding:15px}
.card{background:#151d35;padding:20px;border-radius:12px;margin-bottom:20px}
h2{margin-top:0;color:#c4b5fd}
input,textarea{width:100%;padding:12px;margin:7px 0 14px;background:#0b1020;border:1px solid #394563;border-radius:7px;color:white}
textarea{min-height:85px;resize:vertical}
label{font-size:14px;color:#cbd5e1}
.task{background:#202b48;padding:15px;border-radius:9px;margin:12px 0}
.task h3{margin:0 0 8px;color:#c4b5fd}
.task p{overflow-wrap:anywhere;color:#cbd5e1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.danger{background:#dc3545}
.secondary{background:#475569}
#message{padding:12px;border-radius:8px;display:none;margin-bottom:15px}
.success{background:#14532d}
.error{background:#7f1d1d}
.small{font-size:13px;color:#94a3b8}
</style>
</head>

<body>

<header>
  <h1>TaskNova Admin</h1>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<main>

<div id="message"></div>

<section class="card">
  <h2>Create New Task</h2>

  <form id="taskForm">
    <label>Task Title</label>
    <input id="title" required maxlength="150">

    <label>Description</label>
    <textarea id="description" required maxlength="5000"></textarea>

    <label>Category</label>
    <input id="category" required placeholder="Website Visits, Surveys, Videos..." maxlength="100">

    <label>Reward (USD)</label>
    <input id="reward" type="number" min="0.01" step="0.01" required>

    <label>Task Website URL (optional)</label>
    <input id="taskUrl" type="url" placeholder="https://example.com">

    <button type="submit" id="createBtn">Create Task</button>
  </form>
</section>

<section class="card">
  <h2>All Tasks</h2>
  <button id="refreshBtn" class="secondary">Refresh Tasks</button>
  <p class="small">Manage, edit, activate, deactivate or delete your tasks.</p>
  <div id="taskList">Loading tasks...</div>
</section>

</main>

<script>
const SUPABASE_URL = "https://nplaagzwpthofvounzma.supabase.co";
const SUPABASE_KEY = "sb_publishable_L0govATO3SUeAMmbGGMjNw_F-S0jApB";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const messageBox = document.getElementById("message");
const taskList = document.getElementById("taskList");

function showMessage(message, type="success") {
  messageBox.textContent = message;
  messageBox.className = type;
  messageBox.style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function startAdmin() {
  const {data: sessionData, error: sessionError} =
    await db.auth.getSession();

  if (sessionError || !sessionData.session) {
    window.location.href = "login.html";
    return;
  }

  const {data: isAdmin, error} =
    await db.rpc("is_tasknova_admin");

  if (error || isAdmin !== true) {
    document.body.innerHTML =
      "<h2 style='padding:30px;color:white'>Administrator access denied. Please log in with your administrator account.</h2>";
    return;
  }

  await loadTasks();
}

async function loadTasks() {
  taskList.textContent = "Loading tasks...";

  const {data, error} = await db
    .from("tasks")
    .select("*")
    .order("created_at", {ascending:false});

  if (error) {
    taskList.textContent = "Could not load tasks: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    taskList.textContent = "No tasks have been created yet.";
    return;
  }

  taskList.innerHTML = "";

  data.forEach(task => {
    const item = document.createElement("div");
    item.className = "task";

    const title = document.createElement("h3");
    title.textContent = task.title;

    const description = document.createElement("p");
    description.textContent = task.description;

    const details = document.createElement("p");
    details.textContent =
      "Category: " + task.category +
      " | Reward: $" + Number(task.reward).toFixed(2) +
      " | Status: " + task.status;

    const url = document.createElement("p");
    url.textContent = task.task_url || "No website URL";

    const actions = document.createElement("div");
    actions.className = "actions";

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.onclick = () => editTask(task);

    const statusBtn = document.createElement("button");
    statusBtn.textContent =
      task.status === "active" ? "Deactivate" : "Activate";
    statusBtn.className = "secondary";
    statusBtn.onclick = () => changeStatus(task);

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "danger";
    deleteBtn.onclick = () => deleteTask(task);

    actions.append(editBtn, statusBtn, deleteBtn);
    item.append(title, description, details, url, actions);
    taskList.appendChild(item);
  });
}

document.getElementById("taskForm").addEventListener("submit",
async function(event) {
  event.preventDefault();

  const button = document.getElementById("createBtn");
  button.disabled = true;
  button.textContent = "Creating...";

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const category = document.getElementById("category").value.trim();
  const reward = Number(document.getElementById("reward").value);
  const taskUrl = document.getElementById("taskUrl").value.trim();

  if (!Number.isFinite(reward) || reward <= 0) {
    showMessage("Enter a valid reward greater than zero.", "error");
    button.disabled = false;
    button.textContent = "Create Task";
    return;
  }

  if (taskUrl && !/^https?:\/\//i.test(taskUrl)) {
    showMessage("The website URL must start with https:// or http://", "error");
    button.disabled = false;
    button.textContent = "Create Task";
    return;
  }

  const {data, error} = await db.rpc("admin_create_task", {
    p_title: title,
    p_description: description,
    p_category: category,
    p_reward: reward,
    p_task_url: taskUrl || null
  });

  button.disabled = false;
  button.textContent = "Create Task";

  if (error) {
    showMessage("Create task failed: " + error.message, "error");
    return;
  }

  showMessage("Task created successfully. Task ID: " + data);
  this.reset();
  await loadTasks();
});

async function editTask(task) {
  const title = prompt("Task title:", task.title);
  if (title === null) return;

  const description = prompt("Task description:", task.description);
  if (description === null) return;

  const category = prompt("Task category:", task.category);
  if (category === null) return;

  const rewardInput = prompt("Task reward:", task.reward);
  if (rewardInput === null) return;

  const reward = Number(rewardInput);

  if (!Number.isFinite(reward) || reward <= 0) {
    showMessage("Enter a valid reward.", "error");
    return;
  }

  const taskUrl = prompt("Task URL (leave blank if none):", task.task_url || "");
  if (taskUrl === null) return;

  const {error} = await db.rpc("admin_update_task", {
    p_task_id: task.id,
    p_title: title.trim(),
    p_description: description.trim(),
    p_category: category.trim(),
    p_reward: reward,
    p_task_url: taskUrl.trim() || null
  });

  if (error) {
    showMessage("Update failed: " + error.message, "error");
    return;
  }

  showMessage("Task updated successfully.");
  await loadTasks();
}

async function changeStatus(task) {
  const newStatus = task.status === "active" ? "inactive" : "active";

  const {error} = await db.rpc("admin_set_task_status", {
    p_task_id: task.id,
    p_status: newStatus
  });

  if (error) {
    showMessage("Status update failed: " + error.message, "error");
    return;
  }

  showMessage("Task is now " + newStatus + ".");
  await loadTasks();
}

async function deleteTask(task) {
  if (!confirm("Are you sure you want to delete this task?")) return;

  const {error} = await db.rpc("admin_delete_task", {
    p_task_id: task.id
  });

  if (error) {
    showMessage("Delete failed: " + error.message, "error");
    return;
  }

  showMessage("Task deleted successfully.");
  await loadTasks();
}

document.getElementById("refreshBtn").onclick = loadTasks;

document.getElementById("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  window.location.href = "login.html";
};

startAdmin();
</script>

</body>
  </html>
