<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7041d8">
  <title>Task History | TaskNova</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f7fc;
      color: #171323;
      padding-bottom: 90px;
    }

    .header {
      background: #fff;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eeeaf5;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #7041d8;
    }

    .brand small {
      display: block;
      font-size: 10px;
      color: #777;
      font-weight: 400;
      margin-top: 3px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #7041d8;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 24px 17px;
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .page-heading h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .page-heading p {
      color: #77717f;
      font-size: 14px;
      line-height: 1.5;
    }

    .summary-card {
      background: linear-gradient(135deg, #8152e8, #572bb8);
      color: white;
      border-radius: 18px;
      padding: 21px;
      margin-bottom: 23px;
      box-shadow: 0 8px 22px rgba(92, 49, 183, .18);
    }

    .summary-card small {
      font-size: 13px;
      opacity: .85;
    }

    .summary-card h2 {
      font-size: 30px;
      margin: 8px 0;
    }

    .summary-card p {
      font-size: 12px;
      opacity: .85;
    }

    .filter-row {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 18px;
    }

    .filter-button {
      border: 1px solid #e5dff0;
      background: #fff;
      color: #625b6c;
      padding: 10px 17px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-button.active {
      background: #7041d8;
      border-color: #7041d8;
      color: #fff;
    }

    .history-list {
      display: grid;
      gap: 13px;
    }

    .history-card {
      background: #fff;
      border: 1px solid #e9e5ef;
      border-radius: 15px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(25, 15, 50, .035);
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .history-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .history-date {
      color: #88818f;
      font-size: 12px;
    }

    .history-reward {
      color: #5429b2;
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 13px;
      background: #f1edfa;
      color: #7041d8;
    }

    .status.approved {
      background: #e5f8ed;
      color: #16834a;
    }

    .status.rejected {
      background: #ffebeb;
      color: #c53a3a;
    }

    .status.pending {
      background: #fff4dc;
      color: #a36b08;
    }

    .empty-state {
      background: #fff;
      border: 1px solid #e9e5ef;
      border-radius: 17px;
      padding: 38px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 13px;
    }

    .empty-state h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: #817b89;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state a {
      display: inline-block;
      margin-top: 18px;
      background: #7041d8;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .message {
      padding: 14px;
      border-radius: 11px;
      font-size: 13px;
      background: #fff;
      color: #777;
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #fff;
      border-top: 1px solid #eeeaf5;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      text-decoration: none;
      color: #898391;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      min-width: 50px;
    }

    .nav-item span:first-child {
      font-size: 20px;
    }

    .nav-item.active {
      color: #7041d8;
      font-weight: 800;
    }
  </style>
</head>
<body><header class="header">
  <div class="brand">
    TaskNova
    <small>Complete tasks. Earn rewards.</small>
  </div>

  <div class="profile">
    <span id="headerName">Member</span>
    <div class="avatar" id="avatar">M</div>
  </div>
</header>

<main class="container">
  <div class="page-heading">
    <h1>Task History</h1>
    <p>Track your completed tasks, submissions and rewards.</p>
  </div>

  <section class="summary-card">
    <small>Total approved earnings</small>
    <h2 id="totalEarned">$0.00</h2>
    <p>Your approved task rewards</p>
  </section>

  <div class="filter-row">
    <button class="filter-button active" data-filter="all">All</button>
    <button class="filter-button" data-filter="pending">Pending</button>
    <button class="filter-button" data-filter="approved">Approved</button>
    <button class="filter-button" data-filter="rejected">Rejected</button>
  </div>

  <section class="history-list" id="historyList">
    <div class="message">Loading your task history...</div>
  </section>
</main>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item">
    <span>⌂</span>
    <span>Home</span>
  </a>

  <a href="offers.html" class="nav-item">
    <span>▣</span>
    <span>Offers</span>
  </a>

  <a href="history.html" class="nav-item active">
    <span>◷</span>
    <span>History</span>
  </a>

  <a href="referrals.html" class="nav-item">
    <span>♧</span>
    <span>Refer</span>
  </a>

  <a href="withdraw.html" class="nav-item">
    <span>＄</span>
    <span>Withdraw</span>
  </a>
</nav><script>
const SUPABASE_URL = "https://nplaagzwpthofvounzma.supabase.co";
const SUPABASE_KEY = "sb_publishable_L0govATO3SUeAMmbGGMjNw_F-S0jApB";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allSubmissions = [];
let activeFilter = "all";

function money(value) {
  return "$" + Number(value || 0).toFixed(2);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

function formatDate(value) {
  if (!value) return "Date unavailable";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Date unavailable";
  }

  return date.toLocaleDateString(undefined, {
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function normaliseStatus(status) {
  const value = String(status || "pending").toLowerCase();

  if (["approved", "completed", "paid"].includes(value)) {
    return "approved";
  }

  if (["rejected", "declined"].includes(value)) {
    return "rejected";
  }

  return "pending";
}

function renderHistory() {
  const list = document.getElementById("historyList");

  const filtered = activeFilter === "all"
    ? allSubmissions
    : allSubmissions.filter(item =>
        normaliseStatus(item.status) === activeFilter
      );

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <h3>No task history found</h3>
        <p>
          Your task submissions will appear here after you
          complete and submit an offer.
        </p>
        <a href="offers.html">Explore offers</a>
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(item => {
    const status = normaliseStatus(item.status);

    const title =
      item.task_title ||
      item.title ||
      item.task?.title ||
      "Task submission";

    const reward =
      item.reward_snapshot ??
      item.reward ??
      item.amount ??
      0;

    const date =
      item.created_at ||
      item.submitted_at ||
      item.updated_at;

    return `
      <article class="history-card">
        <div class="history-top">
          <div>
            <div class="history-title">
              ${escapeHTML(title)}
            </div>

            <div class="history-date">
              ${escapeHTML(formatDate(date))}
            </div>
          </div>

          <div class="history-reward">
            ${money(reward)}
          </div>
        </div>

        <span class="status ${status}">
          ${status.charAt(0).toUpperCase() + status.slice(1)}
        </span>
      </article>
    `;
  }).join("");
}

async function loadHistory() {
  const {
    data: authData,
    error: authError
  } = await db.auth.getUser();

  if (authError || !authData.user) {
    window.location.href = "login.html";
    return;
  }

  const {
    data,
    error
  } = await db.rpc("get_tasknova_member_dashboard");

  if (error) {
    document.getElementById("historyList").innerHTML = `
      <div class="message">
        Unable to load your task history. Please try again later.
      </div>
    `;
    return;
  }

  const dashboard = data || {};
  const profile = dashboard.profile || {};
  const fullName =
    profile.full_name ||
    authData.user.user_metadata?.full_name ||
    "Member";

  document.getElementById("headerName").textContent =
    fullName.split(" ")[0];

  document.getElementById("avatar").textContent =
    fullName.charAt(0).toUpperCase();

  const wallet = dashboard.wallet || {};

  document.getElementById("totalEarned").textContent =
    money(wallet.total_earned);

  allSubmissions = Array.isArray(dashboard.submissions)
    ? dashboard.submissions
    : [];

  renderHistory();
}

document.querySelectorAll(".filter-button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter-button").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    activeFilter = button.dataset.filter;

    renderHistory();
  });
});

loadHistory();
</script>

</body>
</html>
