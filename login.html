<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>Login | TaskNova</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7fc;color:#171329;font-family:Arial,sans-serif}
header{height:70px;background:#fff;border-bottom:1px solid #eee9f5;display:flex;align-items:center;justify-content:space-between;padding:0 6%;gap:15px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#171329}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#6d28d9,#a78bfa);display:grid;place-items:center;color:white;font-size:22px;font-weight:bold}
.brand strong{font-size:20px}
header a.signup{color:#6d28d9;text-decoration:none;font-weight:bold;font-size:14px}
main{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:35px 15px}
.container{width:100%;max-width:450px;background:white;border:1px solid #ebe6f3;border-radius:22px;padding:32px;box-shadow:0 12px 40px #24134a0d}
h1{font-size:29px;margin:0 0 9px;text-align:center}
.intro{text-align:center;color:#77738a;font-size:14px;line-height:1.6;margin:0 0 27px}
label{display:block;font-size:13px;font-weight:bold;margin:16px 0 7px;color:#393348}
input{width:100%;padding:14px;border:1px solid #ded8ea;border-radius:11px;font-size:14px;background:#fff;color:#171329;outline:none}
input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf61c}
button{width:100%;padding:15px;border:0;border-radius:11px;background:linear-gradient(110deg,#6d28d9,#8b5cf6);color:white;font-size:15px;font-weight:bold;cursor:pointer;margin-top:22px}
button:disabled{opacity:.6;cursor:not-allowed}
.forgot{text-align:right;margin-top:12px;font-size:13px}
a{color:#6d28d9;text-decoration:none;font-weight:bold}
#message{display:none;padding:12px;border-radius:10px;margin-bottom:15px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.note{background:#f4efff;border-radius:11px;padding:13px;margin-top:20px;color:#5b21b6;font-size:12px;line-height:1.6;text-align:center}
.bottom{text-align:center;font-size:13px;color:#77738a;margin-top:24px}
@media(max-width:500px){header{padding:0 17px}.container{padding:25px 20px}h1{font-size:25px}}
</style>
</head>

<body>

<header>
<a class="brand" href="index.html">
<div class="logo">✦</div>
<strong>TaskNova</strong>
</a>
<a class="signup" href="register.html">Create account</a>
</header>

<main>
<div class="container">

<h1>Welcome back</h1>
<p class="intro">Log in to your TaskNova account and continue earning.</p>

<div id="message"></div>

<form id="loginForm">

<label for="email">Email address</label>
<input
id="email"
type="email"
placeholder="Enter your email address"
required
autocomplete="email"
>

<label for="password">Password</label>
<input
id="password"
type="password"
placeholder="Enter your password"
required
autocomplete="current-password"
>

<div class="forgot">
<a href="#" id="forgotPassword">Forgot password?</a>
</div>

<button type="submit" id="loginBtn">Log in to TaskNova</button>

</form>

<div class="note">
🔒 Your account is protected. TaskNova registration is free and does not require a deposit or subscription.
</div>

<p class="bottom">
Don't have an account? <a href="register.html">Create one</a>
</p>

</div>
</main><script>
const SUPABASE_URL="https://nplaagzwpthofvounzma.supabase.co";
const SUPABASE_KEY="sb_publishable_L0govATO3SUeAMmbGGMjNw_F-S0jApB";

const client=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const loginBtn=document.getElementById("loginBtn");

function showMessage(text,type){
message.textContent=text;
message.className=type;
message.style.display="block";
message.scrollIntoView({behavior:"smooth",block:"center"});
}

form.addEventListener("submit",async function(event){
event.preventDefault();

message.style.display="none";

const email=document.getElementById("email").value.trim().toLowerCase();
const password=document.getElementById("password").value;

loginBtn.disabled=true;
loginBtn.textContent="Signing in...";

try{
const {data,error}=await client.auth.signInWithPassword({
email:email,
password:password
});

if(error)throw error;

if(!data.session){
throw new Error("Login was unsuccessful. Please try again.");
}

showMessage("Login successful. Redirecting to your dashboard...","success");

setTimeout(()=>{
window.location.href="dashboard.html";
},900);

}catch(error){
showMessage(error.message||"Login failed. Please check your details.","error");
loginBtn.disabled=false;
loginBtn.textContent="Log in to TaskNova";
}
});

document.getElementById("forgotPassword").addEventListener("click",async function(event){
event.preventDefault();

const email=document.getElementById("email").value.trim().toLowerCase();

if(!email){
showMessage("Enter your email address first, then select Forgot password.","error");
return;
}

try{
const {error}=await client.auth.resetPasswordForEmail(email,{
redirectTo:"https://tasknovaglobal.github.io/tasknova/login.html"
});

if(error)throw error;

showMessage("If an account exists for that email, a password reset link will be sent.","success");

}catch(error){
showMessage(error.message||"Could not send the reset email.","error");
}
});

(async function(){
const {data}=await client.auth.getSession();

if(data.session){
window.location.href="dashboard.html";
}
})();
</script>

</body>
</html>
