<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join TaskNova</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080d20;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 440px;
    background: #151c35;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #a78bfa;
}

h2 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aab2ca;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border: 1px solid #35405e;
    border-radius: 9px;
    background: #0c1329;
    color: white;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 15px;
    background: #8055ed;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.message {
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
}

a {
    color: #b69aff;
    text-decoration: none;
}

.footer {
    text-align: center;
    margin-top: 22px;
    color: #aab2ca;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">TaskNova</div>

    <h2>Create Your Account</h2>

    <p class="subtitle">Join TaskNova and start completing tasks.</p>

    <form id="registerForm">

        <input id="fullName" type="text"
        placeholder="Full Name" required>

        <input id="username" type="text"
        placeholder="Username" required>

        <input id="email" type="email"
        placeholder="Email Address" required>

        <input id="password" type="password"
        placeholder="Password (minimum 6 characters)"
        minlength="6" required>

        <input id="country" type="text"
        placeholder="Country" required>

        <input id="referral" type="text"
        placeholder="Referral Code (Optional)">

        <button id="submitButton" type="submit">
            Create Account
        </button>

    </form>

    <p id="message" class="message"></p>

    <div class="footer">
        Already have an account?
        <a href="login.html">Login</a>
        <br><br>
        <a href="index.html">Back to Home</a>
    </div>

</div>

<script type="module">

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
    'https://nplaagzwpthofvounzma.supabase.co',
    'sb_publishable_L0govATO3SUeAMmbGGMjNw_F-S0jApB'
);

const form = document.getElementById('registerForm');
const message = document.getElementById('message');
const button = document.getElementById('submitButton');

form.addEventListener('submit', async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = 'Creating Account...';
    message.textContent = '';

    const { error } = await supabase.auth.signUp({

        email: document.getElementById('email').value.trim(),

        password: document.getElementById('password').value,

        options: {
            data: {
                full_name: document.getElementById('fullName').value.trim(),
                username: document.getElementById('username').value.trim(),
                country: document.getElementById('country').value.trim(),
                referral_code: document.getElementById('referral').value.trim()
            }
        }

    });

    button.disabled = false;
    button.textContent = 'Create Account';

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent =
        'Registration successful! Please check your email for confirmation.';

    form.reset();

});

</script>

</body>
          </html>
