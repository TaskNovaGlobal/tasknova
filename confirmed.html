<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>Email Confirmation | TaskNova</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7fc;color:#171329;font-family:Arial,sans-serif}
header{height:70px;background:#fff;border-bottom:1px solid #eee9f5;display:flex;align-items:center;padding:0 6%}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#171329}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#6d28d9,#a78bfa);display:grid;place-items:center;color:white;font-size:22px;font-weight:bold}
.brand strong{font-size:20px}
main{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:25px 15px}
.card{width:100%;max-width:480px;background:white;border:1px solid #ebe6f3;border-radius:22px;padding:35px 28px;text-align:center;box-shadow:0 12px 40px #24134a0d}
.icon{width:75px;height:75px;margin:0 auto 22px;border-radius:50%;background:#f0eafd;color:#6d28d9;display:grid;place-items:center;font-size:36px}
h1{font-size:27px;margin:0 0 13px}
p{font-size:14px;color:#77738a;line-height:1.7;margin:0 0 20px}
button{width:100%;padding:15px;border:0;border-radius:11px;background:linear-gradient(110deg,#6d28d9,#8b5cf6);color:white;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px}
.secondary{background:#f0ebfa;color:#5b21b6}
a{display:block;text-decoration:none}
.small{font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html">
<div class="logo">✦</div>
<strong>TaskNova</strong>
</a>
</header>

<main>
<div class="card">
<div class="icon">✉</div>
<h1>Check your email</h1>
<p>
Thank you for joining TaskNova! We've received your registration.
Please open the confirmation email sent to your inbox and click
the confirmation link to activate your account.
</p><button onclick="location.href='login.html'">
Continue to login
</button>

<a href="index.html">
<button class="secondary">Back to homepage</button>
</a>

<p class="small">
Can't find the email? Check your spam or junk folder.
</p>
</div>
</main>
</body>
</html>
